name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Sync Capacitor
        working-directory: web
        run: npx cap sync android

      - name: Build APK
        working-directory: web/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: banyu-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: web/android/app/build/outputs/apk/debug/app-debug.apk
          name: 伴语 Banyu v1.0.0
          body: |
            ## 伴语 (Banyu) Android APK

            ### 安装
            1. 下载 app-debug.apk
            2. 手机设置中允许"安装未知来源应用"
            3. 安装 APK
            4. 确保电脑运行后端服务 (端口 8000 + 3000)
            5. 手机和电脑在同一局域网
            6. 修改 capacitor.config.ts 的 server.url 为电脑 IP

            ### Web 版
            ```bash
            cd server && pip install -r requirements.txt && python -m uvicorn app.main:app --port 8000
            cd web && npm install && npm run dev
            ```
